# App Factory — build workflow for GENERATED apps (monorepo mode).
# Lives in the app-factory-outputs repo. Each app = a folder under apps/.
# Dispatched per build with the app_dir input; publishes a per-app release.

name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_dir:
        description: Folder under apps/ to build (e.g. apps/proj-stress-01)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK ({{APP_DIR_LABEL}})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Build app sources
        working-directory: ${{ inputs.app_dir }}
        run: |
          set -e
          # Generated projects contain only lib/ + pubspec.yaml + tests —
          # scaffold Android here so the agent never hand-writes gradle.
          if [ ! -d android ]; then
            flutter create . --platforms android --org com.appfactory --project-name __DART__
          fi
          MAN=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MAN"; then
            # Must land INSIDE the manifest element (appended after its line)
            sed -i '/<manifest /a\
                <uses-permission android:name="android.permission.INTERNET"/>' "$MAN"
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/isMinifyEnabled = true/isMinifyEnabled = false/' android/app/build.gradle.kts
          fi
          python3 - <<'PY'
          import xml.dom.minidom
          xml.dom.minidom.parse('android/app/src/main/AndroidManifest.xml')
          print("manifest XML ok")
          PY

      - name: Build APK (universal, release, debug-signed)
        working-directory: ${{ inputs.app_dir }}
        run: flutter build apk --release

      - name: Publish APK to the app's own release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ inputs.app_dir }}
        run: |
          TAG="af-$(basename '${{ inputs.app_dir }}')"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --latest --title "Latest APK build" \
              --notes "Rolling test build from App Factory CI."
          gh release edit "$TAG" --latest \
            --notes "Build #${{ github.run_number }} 📱 universal (all ABIs) · debug-signed (installable) · generated by App Factory"
          gh release upload "$TAG" build/app/outputs/flutter-apk/app-release.apk --clobber
