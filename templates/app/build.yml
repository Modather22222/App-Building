# App Factory — build workflow for GENERATED apps.
# The factory worker copies this file into the generated repo, replacing
# __SLUG__ (repo-style dash slug) and __DART__ (valid dart package name).
name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build universal APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      # Generated projects contain only lib/ + pubspec.yaml + tests.
      # The factory generates Android scaffolding here so the agent never
      # has to hand-write gradle files (fewer failure modes, fewer tokens).
      - name: Ensure android platform scaffolding
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms android --org com.appfactory --project-name __DART__
          fi

      # Known-good settings baked in from incidents in the factory repo:
      # - INTERNET permission is missing from the default main manifest
      # - R8 must stay disabled (shared_preferences has no consumer rules)
      - name: Apply known-good Android settings
        run: |
          set -e
          MAN=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MAN"; then
            # Must land INSIDE the manifest element (appended after its line) —
            # inserting before the root element breaks the XML parse.
            sed -i '/<manifest /a\
                <uses-permission android:name="android.permission.INTERNET"/>' "$MAN"
          fi
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/isMinifyEnabled = true/isMinifyEnabled = false/' android/app/build.gradle.kts
          fi

      - name: Validate manifest XML before spending build minutes
        run: |
          python3 - <<'PY'
          import xml.dom.minidom
          xml.dom.minidom.parse('android/app/src/main/AndroidManifest.xml')
          print("manifest XML ok")
          PY

      - name: Build APK (universal, release, debug-signed)
        run: flutter build apk --release

      - name: Publish APK to rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest-build >/dev/null 2>&1 || \
            gh release create latest-build --latest --title "Latest APK build" \
              --notes "Rolling test build from App Factory CI."
          gh release edit latest-build --latest \
            --notes "Build #${{ github.run_number }} 📱 universal (all ABIs) · debug-signed (installable) · generated by App Factory"
          gh release upload latest-build build/app/outputs/flutter-apk/app-release.apk --clobber
