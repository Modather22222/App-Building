# App Building — build workflow for GENERATED apps (monorepo mode).
# Lives in the app-building-outputs repo. Each app = a folder under apps/.
# Dispatched per build with app_dir + dart_name inputs; publishes a per-app
# release. IMPORTANT: this file must stay content-identical for every app —
# per-app identity travels ONLY through dispatch inputs. Baking app-specific
# values here made parallel pushes conflict on this shared file.

name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_dir:
        description: Folder under apps/ (e.g. apps/proj-burst-01)
        required: true
        type: string
      dart_name:
        description: Dart package name (drives applicationId uniqueness)
        required: false
        type: string
        default: flutter_app

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK (${{ inputs.app_dir }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Build app sources
        working-directory: ${{ inputs.app_dir }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: |
          set -e
          # Generated projects contain only lib/ + pubspec.yaml + tests —
          # scaffold Android here so the agent never hand-writes gradle.
          if [ ! -d android ]; then
            flutter create . --platforms android --org com.appbuilding --project-name "${{ inputs.dart_name }}"
          fi
          MAN=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android.permission.INTERNET' "$MAN"; then
            # Must land INSIDE the manifest element (appended after its line)
            sed -i '/<manifest /a\
                <uses-permission android:name="android.permission.INTERNET"/>' "$MAN"
          fi
          # Release signing: decode the upload keystore + write key.properties.
          # Absent secrets → the gradle patch below is skipped and the build
          # falls back to debug signing (never fails a build over this).
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo -n "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            {
              echo "storeFile=upload-keystore.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEYSTORE_ALIAS"
            } > android/key.properties
          fi
          # Phase 5 — R8 ON with flutter-plugin keeps: shrinking app dex
          # (~2-3 MB) is safe once the reflectively-resolved plugin layer is
          # preserved — the pigeon-dispatch white-screen family
          # (shared_preferences_android et al.) came from R8 renaming those
          # symbols. Idempotent; falls back to template defaults cleanly.
          python3 - <<'PY'
          import os, re
          gradle = 'android/app/build.gradle.kts'
          if os.path.exists(gradle):
              src = open(gradle).read()
              if 'proguard-rules.pro' not in src:
                  src = re.sub(
                      r'(isMinifyEnabled\s*=\s*true)',
                      r'\1\n                proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")',
                      src, count=1)
                  open(gradle, 'w').write(src)
                  print("gradle: proguard wiring added")
          rules = 'android/app/proguard-rules.pro'
          if not os.path.exists(rules):
              open(rules, 'w').write(
                  '# Flutter plugin layer is resolved reflectively (pigeon dispatch,\n'
                  '# plugin registry) — preserve it; app code + other libs still shrink.\n'
                  '-keep class io.flutter.** { *; }\n'
                  '# Engine references Play Core split-install classes (deferred\n'
                  '# components) absent from direct-APK builds; paths never execute.\n'
                  '-dontwarn com.google.android.play.core.**\n'
                  '# Honor androidx @Keep annotations (several plugins rely on them).\n'
                  '-keep class * { @androidx.annotation.Keep <fields>; }\n'
                  '-keep class * { @androidx.annotation.Keep <methods>; }\n'
                  '-keep @androidx.annotation.Keep class * { *; }\n')
              print("proguard rules written")
          # Release signing: wire key.properties into the flutter-created
          # gradle (idempotent). Skipped when the keystore isn't present —
          # debug-signed fallback, never a failed build.
          if os.path.exists('android/key.properties') and os.path.exists(gradle):
              src = open(gradle).read()
              if 'keystoreProperties' not in src:
                  loader = (
                      'import java.util.Properties\n'
                      'import java.io.FileInputStream\n\n'
                      'val keystoreProperties = Properties()\n'
                      'val keystorePropertiesFile = rootProject.file("key.properties")\n'
                      'if (keystorePropertiesFile.exists()) {\n'
                      '    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n'
                      '}\n\n'
                  )
                  src = loader + src  # imports must precede plugins{} — prepend
                  signing = (
                      '    signingConfigs {\n'
                      '        create("release") {\n'
                      '            if (keystorePropertiesFile.exists()) {\n'
                      '                keyAlias = keystoreProperties["keyAlias"] as String\n'
                      '                keyPassword = keystoreProperties["keyPassword"] as String\n'
                      '                storeFile = file(keystoreProperties["storeFile"] as String)\n'
                      '                storePassword = keystoreProperties["storePassword"] as String\n'
                      '            }\n'
                      '        }\n'
                      '    }\n\n'
                  )
                  src = src.replace('    buildTypes {', signing + '    buildTypes {', 1)
                  src = src.replace(
                      'signingConfig = signingConfigs.getByName("debug")',
                      'signingConfig = if (keystorePropertiesFile.exists())\n'
                      '                signingConfigs.getByName("release")\n'
                      '            else\n'
                      '                signingConfigs.getByName("debug")',
                      1)
                  open(gradle, 'w').write(src)
                  print("gradle: release signing wired")
          PY
          python3 - <<'PY'
          import xml.dom.minidom
          xml.dom.minidom.parse('android/app/src/main/AndroidManifest.xml')
          print("manifest XML ok")
          PY

      - name: Build APK (release, signed)
        working-directory: ${{ inputs.app_dir }}
        run: flutter build apk --release

      - name: Build AAB (release, signed — Play-ready)
        working-directory: ${{ inputs.app_dir }}
        run: flutter build appbundle --release

      - name: Publish APK + AAB to the app's own release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ inputs.app_dir }}
        run: |
          TAG="af-$(basename '${{ inputs.app_dir }}')"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --latest --title "Latest APK build" \
              --notes "Rolling test build from App Building CI."
          gh release edit "$TAG" --latest \
            --notes "Build #${{ github.run_number }} 📱 universal (all ABIs) · signed (upload key) · AAB for Play · generated by App Building"
          gh release upload "$TAG" build/app/outputs/flutter-apk/app-release.apk --clobber
          gh release upload "$TAG" build/app/outputs/bundle/release/app-release.aab --clobber
