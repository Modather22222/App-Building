name: Factory worker

# Executed when a user confirms "Build this app":
#   - workflow_dispatch from the request-build edge function (project_id input)
#   - repository_dispatch (build-requested) reserved for the Phase 4 queue
#
# Pipeline: read project row → opencode codegen → push private repo →
# trigger its build.yml → poll → publish apk_url back to Supabase.

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: Supabase projects.id to build
        required: true
        type: string
      model:
        description: OpenCode model for codegen
        required: false
        type: string
        default: opencode/glm-5.3-flash
  repository_dispatch:
    types: [build-requested]

permissions:
  contents: read

jobs:
  pipeline:
    name: Codegen + ship to GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout factory repo (templates + worker)
        uses: actions/checkout@v4

      # Flutter is needed for the worker-side smoke-test gate (free public
      # minutes) so broken generated code never reaches a private repo build.
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Pipeline
        env:
          SUPABASE_URL: https://loeaiuktjmhxeoxpyqjl.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          FACTORY_GH_PAT: ${{ secrets.FACTORY_GH_PAT }}
          REPO_OWNER: ${{ github.repository_owner }}
          PROJECT_ID: ${{ inputs.project_id || github.event.client_payload.project_id }}
          MODEL: ${{ inputs.model || github.event.client_payload.model || 'opencode/glm-5.3-flash' }}
        run: bash scripts/worker.sh
