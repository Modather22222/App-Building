name: Android arm64 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build arm64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pubspec.lock', 'android/**/*.gradle*', 'android/gradle/wrapper/*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Unit tests
        run: flutter test

      - name: Build APK (release, unsigned, arm64 + armv7)
        run: flutter build apk --release

      - name: Publish APK to rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest-build >/dev/null 2>&1 || \
            gh release create latest-build --latest --title "Latest arm64 build" \
              --notes "Rolling test build from CI. Every push to main replaces this APK."
          gh release edit latest-build --latest \
            --notes "Build #${{ github.run_number }} · commit ${{ github.sha }} · universal (arm64 + armv7) · debug-signed (installable)"
          gh release upload latest-build build/app/outputs/flutter-apk/app-release.apk --clobber
