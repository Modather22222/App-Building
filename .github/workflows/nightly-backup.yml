# Nightly database backup — pg_dump (Postgres 17 client) -> Backblaze B2.
#
# Retention is handled by the BUCKET LIFECYCLE RULE on B2 (backups/ files
# auto-hide after 14 days, deleted 1 day later) — no cleanup step here.
#
# Secrets:
#   DATABASE_URL   — the Supabase SESSION-POOLER connection string with the
#                    password in place (IPv4; runners have no IPv6)
#   B2_KEY_ID / B2_APP_KEY — the bucket-scoped "appbuilding-backup" key
#   B2_BUCKET / B2_S3_ENDPOINT — app-building / s3.eu-central-003.backblazeb2.com

name: Nightly DB backup

on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: pg_dump -> Backblaze B2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Dump database (custom format, checksummed)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          # Version-exact client inside the official postgres image: a runner
          # pg_dump older than the server refuses to run.
          docker run --rm -v "$PWD:/out" postgres:17-alpine \
            pg_dump --no-owner --no-privileges -Fc -f /out/backup.dump "$DATABASE_URL"
          sha256sum backup.dump | cut -d' ' -f1 > backup.sha256
          gzip backup.dump
          ls -lh backup.dump.gz

      - name: Install rclone (pinned)
        run: |
          RCLONE_VER=1.69.1
          curl -sSfL -o /tmp/rclone.zip "https://downloads.rclone.org/v${RCLONE_VER}/rclone-v${RCLONE_VER}-linux-amd64.zip"
          unzip -q /tmp/rclone.zip -d /tmp
          sudo mv "/tmp/rclone-v${RCLONE_VER}-linux-amd64/rclone" /usr/local/bin/rclone

      - name: Upload to B2 (rclone, native B2 backend)
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
        run: |
          # Native B2 backend — the bucket-scoped key's S3 layer 403s on the
          # HEAD-before-write, the native API is fully proven.
          rclone config create b2 b2 account "$B2_KEY_ID" key "$B2_APP_KEY"
          STAMP=$(date -u +%Y-%m-%d)
          rclone copyto backup.dump.gz "b2:app-building/backups/backup-$STAMP.dump.gz"
          rclone copyto backup.sha256 "b2:app-building/backups/backup-$STAMP.sha256"
          echo "---- backups in the bucket ----"
          rclone lsjson "b2:app-building/backups" | tail -n 8

      - name: Notify on failure
        if: failure()
        env:
          SUPABASE_URL: https://loeaiuktjmhxeoxpyqjl.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Route through the alert consumer (dispatched to the owner's
          # webhook within 10 minutes).
          curl -sS -m 20 -X POST "$SUPABASE_URL/rest/v1/factory_alerts" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "content-type: application/json" \
            -d '{"kind":"backup_failed","detail":"nightly pg_dump to B2 failed - see the run log"}' \
            > /dev/null 2>&1 || true
          echo "backup failed — alert written"
